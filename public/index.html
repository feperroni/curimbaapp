<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100f">
<title>Curimba · Nosso Casuá</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🥁</text></svg>">
</head>
<body data-vista="ritual">

<header class="topo">
  <div class="marca">
    <span class="marca-ico">🥁</span>
    <span class="marca-txt">Curimba<b>Nosso Casuá</b></span>
  </div>

  <nav class="linhas" id="navLinhas">
    <button class="linha-btn" data-vista="ritual">Ritual</button>
    <button class="linha-btn" data-vista="orixas">Orixás</button>
    <button class="linha-btn" data-vista="esquerda">Esquerda</button>
    <button class="linha-btn" data-vista="direita">Direita</button>
    <button class="linha-btn" data-vista="casa">Casa</button>
    <button class="linha-btn" data-vista="toques">Toques</button>
    <button class="linha-btn estreito" data-vista="favoritos" title="Favoritos">★</button>
    <button class="linha-btn estreito" data-vista="giras" title="Giras">Giras</button>
  </nav>

  <div class="acoes-topo">
    <button id="btnBusca" class="icone" title="Buscar">🔍</button>
    <button id="btnNovo" class="icone" title="Adicionar ponto">＋</button>
  </div>
</header>

<!-- faixa de montagem de gira -->
<div class="banner" id="banner" hidden>
  <span class="banner-ico">🎯</span>
  <span class="banner-txt">Montando <b id="bannerNome"></b></span>
  <span class="banner-qtd" id="bannerQtd">0 pontos</span>
  <span class="espaco"></span>
  <button class="btn-neutro" id="verRoteiro">Ver roteiro</button>
  <button class="btn-neutro" id="cancelarGira">Cancelar</button>
  <button class="btn-forte" id="salvarGira">Salvar gira</button>
</div>

<nav class="entidades" id="navEntidades"></nav>

<div class="filtros" id="filtros">
  <div class="chips" id="chipsMomento"></div>
  <div class="chips chips-ritmo" id="chipsRitmo"></div>
</div>

<div class="busca-barra" id="buscaBarra" hidden>
  <input type="search" id="campoBusca" placeholder="Buscar em todos os pontos: trecho da letra, entidade, ritmo…" autocomplete="off">
  <button id="fecharBusca" class="icone">✕</button>
</div>

<main class="palco">
  <aside class="lista-wrap">
    <div class="lista-cab">
      <span id="contador">0 pontos</span>
      <button class="mini" id="empilharTudo" title="Voltar a mostrar todos os pontos da lista">Ver todos</button>
    </div>
    <ul class="lista" id="lista"></ul>
  </aside>

  <section class="leitor" id="leitor">
    <div class="vazio" id="vazio">
      <p class="vazio-ico">🎼</p>
      <p>Nada para mostrar com os filtros de agora.<br>Escolha outra entidade acima.</p>
    </div>
    <div class="pilha" id="pilha"></div>
  </section>
</main>

<div class="rodape-pilha" id="rodapePilha">
  <div class="alternador" id="altModo">
    <button data-modo="tudo" title="Mostrar todos os pontos da lista, para ir rolando">Tudo</button>
    <button data-modo="selecao" title="Mostrar só os pontos que você escolheu">Seleção</button>
  </div>
  <div class="alternador" id="altColunas">
    <button data-colunas="1" title="Uma coluna, letra maior">1 col</button>
    <button data-colunas="2" title="Duas colunas, mais pontos por tela">2 col</button>
  </div>
  <button class="icone rolar-btn" id="rolar" title="Rolar sozinho">▶</button>
  <div class="alternador" id="velocidades">
    <button data-vel="lento" title="Rolagem lenta">Lento</button>
    <button data-vel="medio" title="Rolagem média">Médio</button>
    <button data-vel="rapido" title="Rolagem rápida">Rápido</button>
  </div>
  <span id="pilhaInfo"></span>
  <span class="espaco"></span>
  <button class="icone" id="btnMenor" title="Diminuir letra">A−</button>
  <button class="icone" id="btnMaior" title="Aumentar letra">A+</button>
  <button class="icone icone-txt" id="limparPilha" hidden>Limpar</button>
  <button class="icone icone-txt" id="telaCheia" title="Esconder menus e ver só as letras">⤢ Tela cheia</button>
</div>

<!-- modal de ponto -->
<div class="modal" id="modal" hidden>
  <form class="modal-caixa" id="form">
    <div class="modal-cab">
      <h2 id="modalTitulo">Novo ponto</h2>
      <button type="button" class="icone" id="fecharModal">✕</button>
    </div>

    <div class="modal-corpo">
      <label>Linha
        <select name="linha" id="fLinha" required>
          <option value="ritual">Ritual</option>
          <option value="orixas">Orixás</option>
          <option value="esquerda">Esquerda</option>
          <option value="direita">Direita</option>
        </select>
      </label>

      <label>Entidade
        <input name="entidade" id="fEntidade" list="listaEntidades" required placeholder="Ex: Ogum, Exu, Preto Velho">
        <datalist id="listaEntidades"></datalist>
      </label>

      <label>Entidade específica <span class="op">(opcional)</span>
        <input name="entidade_especifica" id="fEspecifica" placeholder="Ex: Tranca Ruas, Zé Pelintra">
      </label>

      <label>Momento
        <select name="momento" id="fMomento"></select>
      </label>

      <fieldset class="campo-ritmos">
        <legend>Ritmos</legend>
        <div class="chips" id="fRitmos"></div>
      </fieldset>

      <label>Título <span class="op">(em branco usa a primeira linha da letra)</span>
        <input name="titulo" id="fTitulo" placeholder="Gerado automaticamente">
      </label>

      <label>Letra
        <textarea name="letra" id="fLetra" rows="9" required placeholder="Uma linha por verso"></textarea>
      </label>

      <label class="linha-checkbox">
        <input type="checkbox" name="coringa" id="fCoringa"> Ponto coringa (serve qualquer entidade da linha)
      </label>

      <label class="linha-checkbox">
        <input type="checkbox" name="da_casa" id="fDaCasa"> Ponto da casa (aparece também na aba Casa)
      </label>

      <label>Senha de edição
        <input type="password" name="senha" id="fSenha" required placeholder="Senha do terreiro">
      </label>

      <p class="erro" id="formErro" hidden></p>
    </div>

    <div class="modal-rodape">
      <button type="button" class="btn-perigo" id="btnExcluir" hidden>Excluir</button>
      <span class="espaco"></span>
      <button type="button" class="btn-neutro" id="cancelar">Cancelar</button>
      <button type="submit" class="btn-forte" id="salvar">Salvar</button>
    </div>
  </form>
</div>

<!-- modal de gira -->
<div class="modal" id="modalGira" hidden>
  <form class="modal-caixa estreita" id="formGira">
    <div class="modal-cab">
      <h2 id="modalGiraTitulo">Nova gira</h2>
      <button type="button" class="icone" id="fecharModalGira">✕</button>
    </div>
    <div class="modal-corpo">
      <label>Nome da gira
        <input id="gNome" required placeholder="Ex: Gira de Pretos Velhos">
      </label>
      <label>Observação <span class="op">(opcional)</span>
        <input id="gObs" placeholder="Ex: primeira sexta do mês">
      </label>
      <p class="dica" id="gDica"></p>
      <label>Senha de edição
        <input type="password" id="gSenha" required placeholder="Senha do terreiro">
      </label>
      <p class="erro" id="giraErro" hidden></p>
    </div>
    <div class="modal-rodape">
      <button type="button" class="btn-perigo" id="btnExcluirGira" hidden>Excluir gira</button>
      <span class="espaco"></span>
      <button type="button" class="btn-neutro" id="cancelarGiraModal">Cancelar</button>
      <button type="submit" class="btn-forte">Salvar</button>
    </div>
  </form>
</div>

<button class="sair-cheia" id="sairCheia" hidden title="Sair da tela cheia">
  <span id="cheiaOnde"></span>
  <span class="sair-ico">⤡</span>
</button>

<div class="aviso" id="aviso" hidden></div>

<script src="/app.js"></script>
</body>
</html>
