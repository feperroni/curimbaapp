<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100f">
<title>Curimba · Nosso Cazuá</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🥁</text></svg>">
</head>
<body data-linha="ritual">

<header class="topo">
  <div class="marca">
    <span class="marca-ico">🥁</span>
    <span class="marca-txt">Curimba<b>Nosso Cazuá</b></span>
  </div>

  <nav class="linhas" id="navLinhas">
    <button class="linha-btn" data-linha="ritual">Ritual</button>
    <button class="linha-btn" data-linha="orixas">Orixás</button>
    <button class="linha-btn" data-linha="esquerda">Esquerda</button>
    <button class="linha-btn" data-linha="direita">Direita</button>
  </nav>

  <div class="acoes-topo">
    <button id="btnBusca" class="icone" title="Buscar">🔍</button>
    <button id="btnNovo" class="icone" title="Adicionar ponto">＋</button>
  </div>
</header>

<nav class="entidades" id="navEntidades"></nav>

<div class="filtros" id="filtros">
  <div class="chips" id="chipsMomento"></div>
  <div class="chips chips-ritmo" id="chipsRitmo"></div>
</div>

<div class="busca-barra" id="buscaBarra" hidden>
  <input type="search" id="campoBusca" placeholder="Buscar em todos os pontos: trecho da letra, entidade, ritmo…" autocomplete="off">
  <button id="fecharBusca" class="icone">✕</button>
</div>

<main class="palco">
  <aside class="lista-wrap">
    <div class="lista-cab"><span id="contador">0 pontos</span></div>
    <ul class="lista" id="lista"></ul>
  </aside>

  <section class="leitor" id="leitor">
    <div class="vazio" id="vazio">
      <p class="vazio-ico">🎼</p>
      <p>Escolha uma entidade acima e toque num ponto para abrir a letra.</p>
    </div>
    <article class="ponto" id="ponto" hidden>
      <div class="ponto-cab">
        <div>
          <h1 id="pTitulo"></h1>
          <p class="ponto-meta" id="pMeta"></p>
        </div>
        <div class="ponto-acoes">
          <button id="btnMenor" class="icone" title="Diminuir letra">A−</button>
          <button id="btnMaior" class="icone" title="Aumentar letra">A+</button>
          <button id="btnEditar" class="icone icone-txt" title="Editar este ponto">Editar</button>
        </div>
      </div>
      <pre class="letra" id="pLetra"></pre>
    </article>
  </section>
</main>

<!-- modal de cadastro -->
<div class="modal" id="modal" hidden>
  <form class="modal-caixa" id="form">
    <div class="modal-cab">
      <h2 id="modalTitulo">Novo ponto</h2>
      <button type="button" class="icone" id="fecharModal">✕</button>
    </div>

    <div class="modal-corpo">
      <label>Linha
        <select name="linha" id="fLinha" required>
          <option value="ritual">Ritual</option>
          <option value="orixas">Orixás</option>
          <option value="esquerda">Esquerda</option>
          <option value="direita">Direita</option>
        </select>
      </label>

      <label>Entidade
        <input name="entidade" id="fEntidade" list="listaEntidades" required placeholder="Ex: Ogum, Exu, Preto Velho">
        <datalist id="listaEntidades"></datalist>
      </label>

      <label>Entidade específica <span class="op">(opcional)</span>
        <input name="entidade_especifica" id="fEspecifica" placeholder="Ex: Tranca Ruas, Zé Pelintra">
      </label>

      <label>Momento
        <select name="momento" id="fMomento"></select>
      </label>

      <fieldset class="campo-ritmos">
        <legend>Ritmos</legend>
        <div class="chips" id="fRitmos"></div>
      </fieldset>

      <label>Título <span class="op">(em branco usa a primeira linha da letra)</span>
        <input name="titulo" id="fTitulo" placeholder="Gerado automaticamente">
      </label>

      <label>Letra
        <textarea name="letra" id="fLetra" rows="9" required placeholder="Uma linha por verso"></textarea>
      </label>

      <label class="linha-checkbox">
        <input type="checkbox" name="coringa" id="fCoringa"> Ponto coringa (serve qualquer entidade da linha)
      </label>

      <label>Senha de edição
        <input type="password" name="senha" id="fSenha" required placeholder="Senha do terreiro">
      </label>

      <p class="erro" id="formErro" hidden></p>
    </div>

    <div class="modal-rodape">
      <button type="button" class="btn-perigo" id="btnExcluir" hidden>Excluir</button>
      <span class="espaco"></span>
      <button type="button" class="btn-neutro" id="cancelar">Cancelar</button>
      <button type="submit" class="btn-forte" id="salvar">Salvar</button>
    </div>
  </form>
</div>

<div class="aviso" id="aviso" hidden></div>

<script src="/app.js"></script>
</body>
</html>
